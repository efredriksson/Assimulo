[build-system]
requires = [
    "meson-python>=0.16",
    "meson>=1.4",
    "ninja",
    "Cython>=3.0.7",
    "numpy>=2.1",
]
build-backend = "mesonpy"

[project]
name = "Assimulo"
dynamic = ["version"]
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.0",
    "matplotlib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "meson>=1.4",
    "meson-python>=0.16",
    "ninja",
    "Cython>=3.0.7",
]

# ---------------------------------------------------------------------------
# cibuildwheel configuration
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip  = "*-win32 *-manylinux_i686"

[tool.cibuildwheel.linux]
# Use the pre-built assimulo-manylinux image which has SuperLU + SUNDIALS already
# compiled (via Dockerfile.manylinux → tools/wheels/build_dependencies.sh).
# The official manylinux images are intentionally stripped of their package
# manager, so before-all cannot install system packages.
# Build the image first: make build-manylinux-image
manylinux-x86_64-image = "assimulo-manylinux"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
config-settings = {"setup-args" = ["-Dsundials_prefix=/usr", "-Dsuperlu_prefix=/usr", "-Dopenmp=true"]}
