[build-system]
requires = [
    "meson-python>=0.16",
    "meson>=1.4",
    "ninja",
    "Cython>=3.0.7",
    "numpy>=2.1",
]
build-backend = "mesonpy"

[project]
name = "Assimulo"
dynamic = ["version"]
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.0",
    "matplotlib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "meson>=1.4",
    "meson-python>=0.16",
    "ninja",
    "Cython>=3.0.7",
]

# ---------------------------------------------------------------------------
# cibuildwheel configuration
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
skip  = "*-win32 *-manylinux_i686"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
# before-all runs once per container boot, before any Python version is built.
# SuperLU + SUNDIALS only need to be compiled once, so before-all is correct
# (before-build would recompile them once per Python version).
before-all = "bash {project}/tools/wheels/build_dependencies.sh"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
config-settings = {"setup-args" = ["-Dsundials_prefix=/usr", "-Dsuperlu_prefix=/usr", "-Dopenmp=true"]}
