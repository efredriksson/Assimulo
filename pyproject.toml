[build-system]
requires = [
    "meson-python>=0.16",
    "meson>=1.4",
    "ninja",
    "Cython>=3.0.7",
    "numpy>=2.1",
]
build-backend = "mesonpy"

[project]
name = "Assimulo"
dynamic = ["version"]
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.0",
    "matplotlib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "meson>=1.4",
    "meson-python>=0.16",
    "ninja",
    "Cython>=3.0.7",
]
