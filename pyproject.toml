[build-system]
requires = [
    "setuptools",
    "wheel",
    "numpy==1.26.4",
    "cython>=3.0.7"
]
build-backend = "setuptools.build_meta"

[project]
name = "Assimulo"
dynamic = ["version"]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.19.5,<2.0",
    "scipy>=1.10.1",
    "matplotlib>3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4"
]
