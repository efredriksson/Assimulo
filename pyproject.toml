[build-system]
requires = [
    "meson-python>=0.16",
    "meson>=1.4",
    "ninja",
    "Cython>=3.0.7",
    "numpy>=2.1",
]
build-backend = "mesonpy"

[project]
name = "Assimulo"
dynamic = ["version"]
description = "A package for solving ordinary and differential-algebraic equations."
readme = "README.md"
license = { text = "LGPL-3.0-only" }
authors = [{ name = "Modelon AB" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.0",
    "matplotlib>=3.0",
]

[project.urls]
Homepage = "https://github.com/modelon-community/Assimulo"

[dependency-groups]
test = ["pytest>=7.4.4"]
dev = [
    {include-group = "test"},
    "meson>=1.4",
    "meson-python>=0.16",
    "ninja",
    "Cython>=3.0.7",
]

# ---------------------------------------------------------------------------
# cibuildwheel configuration
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip  = "*-win32 *-manylinux_i686 *-musllinux*"
# Smoke each built wheel against pytest before it leaves the runner.
# Runs for every built CPython (3.11/3.12/3.13/3.14) on both Linux and Windows.
# test-groups pulls the `test` dependency group from [dependency-groups]
# above, keeping pytest's pin in a single place.
test-groups   = ["test"]
test-command  = "pytest {project}/tests"

[tool.cibuildwheel.windows]
# SUNDIALS is built in the GHA workflow (tools/wheels/build_dependencies_windows.sh)
# using MSYS2 UCRT64 before cibuildwheel runs. MSYS2 bin dirs are added to PATH
# so meson picks up gcc/gfortran instead of MSVC.
before-build = "pip install delvewheel"
repair-wheel-command = "pwsh {project}/tools/wheels/repair_windows.ps1 {wheel} {dest_dir}"
config-settings = {"setup-args" = ["-Dsundials_prefix=C:/deps", "-Dsuperlu_prefix=C:/deps", "-Dopenmp=true"]}

[tool.cibuildwheel.linux]
# Use the pre-built assimulo-manylinux image which has SuperLU + SUNDIALS already
# compiled (via Dockerfile.manylinux → tools/wheels/build_dependencies.sh).
# The official manylinux images are intentionally stripped of their package
# manager, so before-all cannot install system packages.
# Build the image first: make build-manylinux-image
manylinux-x86_64-image  = "assimulo-manylinux"
manylinux-aarch64-image = "assimulo-manylinux"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
config-settings = {"setup-args" = ["-Dsundials_prefix=/usr", "-Dsuperlu_prefix=/usr", "-Dopenmp=true"]}
