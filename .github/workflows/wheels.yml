name: Build wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux wheels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cibuildwheel==2.22.0

      - name: Build manylinux image (SuperLU + SUNDIALS pre-installed)
        run: docker build -f Dockerfile.manylinux -t assimulo-manylinux .

      - name: Build wheels
        run: cibuildwheel --platform linux --output-dir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl

  upload_pypi:
    name: Upload to PyPI
    needs: [linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/Assimulo
    permissions:
      id-token: write  # required for OIDC Trusted Publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
